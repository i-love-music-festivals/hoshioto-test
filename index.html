<!-- HTML5という現在の標準ルールで書かれた文書であることを宣言します -->
<!DOCTYPE html>
<!-- 言語を日本語（ja）に指定してHTML文書を開始します -->
<html lang="ja">
<!-- 画面には直接表示されない、ブラウザや検索エンジン向けの設定情報を記述する部分です -->
<head>
    <!-- 文字化けを防ぐため、文字コードをUTF-8に指定します -->
    <meta charset="UTF-8">
    <!-- スマホ画面で見たときに、文字やレイアウトが適切なサイズになるように設定します -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ブラウザのタブなどに表示されるページのタイトルです -->
    <title>hoshioto'26 非公式アプリ</title>
    
    <!-- PWA（スマホアプリのようにインストールできる仕組み）用の設定ファイルを読み込みます -->
    <link rel="manifest" href="./manifest.json">
    <!-- スマホブラウザの上部バー（アドレスバー）の色を指定します -->
    <meta name="theme-color" content="#111111">
    
    <!-- ここから下は「SNS（TwitterやLINEなど）でシェアされたとき」に表示される情報を直接HTMLに書き込んでいます -->
    <!-- SNSでのタイトル -->
    <meta property="og:title" content="hoshioto'26 非公式アプリ">
    <!-- SNSでの説明文 -->
    <meta property="og:description" content="タイムテーブル、エリアマップ等を確認できる非公式アプリです。">
    <!-- アプリのURL（公開先のURLに合わせて変更してください） -->
    <meta property="og:url" content="https://example.com/hoshioto2026/">
    <!-- SNSで表示されるサムネイル画像のURL -->
    <meta property="og:image" content="https://example.com/hoshioto2026/hoshioto2026.png">
    <!-- Webサイトの種類を指定 -->
    <meta property="og:type" content="website">
    <!-- サイトの全体名 -->
    <meta property="og:site_name" content="フェスタイムテーブル 非公式ガイド">
    
    <!-- Twitterでシェアされた際に、画像を大きく表示するための設定です -->
    <meta name="twitter:card" content="summary_large_image">
    <!-- Twitter用のサムネイル画像のURL -->
    <meta name="twitter:image" content="https://example.com/hoshioto2026/hoshioto2026.png">
    
    <!-- iPhoneなどのホーム画面に追加された時のアプリアイコン画像です -->
    <link rel="apple-touch-icon" href="https://example.com/hoshioto2026/icon.png">
    <!-- ブラウザのタブに表示される小さなアイコン（ファビコン）です -->
    <link rel="icon" type="image/png" href="https://example.com/hoshioto2026/icon.png">
    
    <!-- 見た目（デザインやレイアウト）を調整するCSSファイルを読み込みます -->
    <link rel="stylesheet" href="./style.css">
</head>
    
<!-- ここから下が、実際に画面に表示される中身（骨組み）です -->
<body>
    <!-- アプリ全体のレイアウトを包み込む一番大きな箱です -->
    <div class="app-container">
        
        <!-- 現在の時刻を表示するための箱です。JSで中身が書き換えられます -->
        <div id="digitalClock"></div>
        
        <!-- 公式サイトへのリンクボタンとなる箱です -->
        <a target="_blank" rel="noopener noreferrer" id="officialLink"></a>
        
        <!-- 画面上部のヘッダー（見出しや検索窓、タブがある部分）をまとめる箱です -->
        <header>
            <!-- アプリのメインタイトルを表示します -->
            <h1 id="appTitle">フェス非公式ガイド</h1>
            <!-- 注意書き（非公式であることなど）を表示する箱です -->
            <div id="disclaimerText" class="disclaimer"></div>
            <!-- データが最後にいつ更新されたかを表示する箱です -->
            <div id="lastUpdated"></div>
            
            <!-- アーティストを検索するための入力欄と、候補を出すリストをまとめた箱です -->
            <div class="search-container">
                <!-- 検索キーワードを入力するテキストボックスです -->
                <input type="text" id="artistSearchInput" autocomplete="off">
                <!-- 検索候補（サジェスト）を表示する箇条書きリストの骨組みです -->
                <ul id="searchSuggestList" class="suggest-list"></ul>
            </div>

            <!-- 画面を切り替えるタブボタン群をまとめた箱です -->
            <div class="tabs" id="tabContainer">
                <button class="tab-btn" id="btnFood"></button>
                <button class="tab-btn" id="btnMap"></button>
                <button class="tab-btn" id="btnWeather"></button>
                <button class="tab-btn" id="btnMemo"></button>
            </div>
        </header>

        <!-- タイムテーブルを表示する画面部分の箱です -->
        <div id="timetableSection" class="content-section">
            <!-- スクロールできるようにするための枠です -->
            <div class="scroll-container" id="ttScrollArea">
                <!-- ステージ名（MOON GARDENなど）を横に並べるための箱です -->
                <div class="stage-headers-wrapper" id="headerWrapper">
                    <!-- 左上の空白（時間軸の上の部分）用の空の箱です -->
                    <div class="stage-header-empty"></div>
                    <!-- 実際のステージ名がJSによって並べられる箱です -->
                    <div class="stage-header-list" id="stageHeaders"></div>
                </div>
                
                <!-- 時間軸とアーティストのブロックを配置するための箱です -->
                <div class="timetable-wrapper" id="ttWrapper">
                    <!-- 左側の時間軸（10:00, 11:00など）が作られる箱です -->
                    <div class="time-col" id="timeCol"></div>
                    <!-- 実際のアーティスト出演ブロックが方眼紙のように配置される箱です -->
                    <div id="gridContainer"></div>
                </div>
            </div>
        </div>

        <!-- フード（フェス飯）情報を表示する画面部分の箱です -->
        <div id="foodSection" class="content-section">
            <h2 class="food-section-header" id="foodHeader"></h2>
            <div id="foodContainer"></div>
            <div class="source-credit" id="foodSourceCredit"></div>
        </div>

        <!-- マップ情報を表示する画面部分の箱です -->
        <div id="mapSection" class="content-section">
            <div class="map-wrapper" id="mapWrapper"></div>
            <!-- マップを拡大・縮小するためのボタン群です -->
            <div class="map-controls">
                <button class="zoom-btn" id="btnZoomIn"></button>
                <button class="zoom-btn" id="btnZoomOut"></button>
                <button class="zoom-btn" id="btnZoomReset"></button>
            </div>
            <div class="source-credit" id="mapSourceCredit"></div>
        </div>

        <!-- 天気予報を表示する画面部分の箱です -->
        <div id="weatherSection" class="content-section">
            <!-- インターネットに繋がっている時に表示する内容です -->
            <div id="weatherOnlineContent" class="weather-content">
                <h2 class="weather-section-header" id="weatherTitle"></h2>
                <!-- ウェザーニュースなどを埋め込むための箱です -->
                <div class="iframe-container" id="weatherIframeContainer"></div>
                <!-- うまく表示されない時の別リンク案内を入れる箱です -->
                <div class="weather-link-notice" id="weatherNotice"></div>
            </div>
            <!-- オフライン時（電波がない時）に表示するエラーメッセージの箱です -->
            <div id="weatherOfflineContent" class="weather-offline-msg"></div>
        </div>

        <!-- メモ帳機能の画面部分の箱です -->
        <div id="memoSection" class="content-section">
            <h2 class="memo-section-header" id="memoHeader"></h2>
            <div class="memo-notice" id="memoNotice"></div>
            <!-- ユーザーが文字を入力できる複数行のテキストエリアです -->
            <textarea id="memoTextArea"></textarea>
        </div>

    </div>
    
    <!-- 検索結果をポップアップ（モーダル）表示する時の背景の黒い半透明の箱です -->
    <div id="searchModalOverlay" class="search-modal-overlay"></div>
    <!-- 検索結果のポップアップ画面本体です -->
    <div id="searchModal" class="search-modal">
        <!-- ポップアップの上部（タイトルと閉じるボタン）です -->
        <div class="search-modal-header">
            <h3 id="searchModalTitle"></h3>
            <button id="searchModalClose" class="search-modal-close"></button>
        </div>
        <!-- ポップアップの中身（いつ、どのステージに出演するか等）が入る箱です -->
        <div id="searchModalContent" class="search-modal-content"></div>
    </div>

    <!-- ロジックやデータ処理を担うJavaScriptファイルを最後に読み込みます -->
    <script src="./script.js"></script>
</body>
</html>
